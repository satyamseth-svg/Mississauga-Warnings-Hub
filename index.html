<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Associate Warning Register — YYZ3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1a1d21;--paper:#f6f4ef;--panel:#ffffff;--line:#e2ddd3;--muted:#7a7469;
    --accent:#8a1c2b;--accent-soft:#f3e3e2;--amber:#a06a10;--amber-soft:#f7ecd4;
    --green:#2f6b3c;--green-soft:#e2efe2;--grey:#5c6470;--grey-soft:#e9ebee;
    --edit:#1c4f8a;--edit-soft:#e3ecf6;
    --shadow:0 1px 2px rgba(26,29,33,.06),0 6px 22px rgba(26,29,33,.05);
    --mono:'DM Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding:28px 20px 90px}
  .wrap{max-width:1140px;margin:0 auto}
  header.top{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-.01em;margin:6px 0 4px}
  .sub{color:var(--muted);font-size:14px}
  .savestate{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
  .savestate .d{width:7px;height:7px;border-radius:50%;background:var(--green)}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0 24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat .n{font-family:'Fraunces',serif;font-size:27px;font-weight:700;line-height:1}
  .stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:7px}
  .stat.acc .n{color:var(--accent)}.stat.ok .n{color:var(--green)}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;font-family:inherit}
  .search input:focus{outline:2px solid var(--edit);outline-offset:-1px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;color:var(--grey);transition:.12s}
  .chip:hover{border-color:var(--ink)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--ink);border-radius:8px;background:var(--panel);cursor:pointer;transition:.12s}
  .btn:hover{background:var(--ink);color:#fff}.btn.p{background:var(--edit);color:#fff;border-color:var(--edit)}.btn.p:hover{opacity:.9}
  .sortbar{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
  .sortbar b{cursor:pointer;color:var(--grey);padding:3px 6px;border-radius:5px}
  .sortbar b:hover{background:var(--grey-soft)}.sortbar b.on{background:var(--ink);color:#fff}

  .assoc{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .assoc.risk{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),var(--shadow)}
  .assoc-head{display:flex;align-items:center;gap:15px;padding:16px 20px;cursor:pointer;user-select:none}
  .assoc-head:hover{background:#faf9f6}
  .count{font-family:'Fraunces',serif;font-weight:700;font-size:22px;min-width:32px;text-align:center}
  .badges{display:flex;gap:5px}.b{width:10px;height:10px;border-radius:3px}
  .b.w0{background:var(--edit)}.b.w1{background:var(--grey)}.b.w2{background:var(--amber)}.b.w3{background:var(--accent)}
  .who{flex:1;min-width:0}.who .nm{font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.1}
  .who .rl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-top:3px}
  .flag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--accent);color:#fff;white-space:nowrap}
  .flag.due{background:var(--amber)}.flag.rev{background:var(--edit)}.flag.gone{background:var(--grey)}
  .assoc.gone{opacity:.62}.assoc.gone .who .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
  .latest{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .latest.l0{background:var(--edit-soft);color:var(--edit)}.latest.l1{background:var(--grey-soft);color:var(--grey)}.latest.l2{background:var(--amber-soft);color:var(--amber)}.latest.l3{background:var(--accent-soft);color:var(--accent)}
  .chev{color:var(--muted);transition:transform .18s}.assoc.open .chev{transform:rotate(90deg)}

  .detail{display:none;border-top:1px solid var(--line);background:#fbfaf7}
  .assoc.open .detail{display:block}
  .timeline{display:flex;gap:0;align-items:flex-start;padding:14px 20px 6px;overflow-x:auto}
  .tl-node{display:flex;flex-direction:column;align-items:center;min-width:100px;position:relative}
  .tl-line{position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
  .tl-node:last-child .tl-line{display:none}
  .tl-dot{width:22px;height:22px;border-radius:50%;color:#fff;font-family:'Fraunces',serif;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:1}
  .tl-dot.w0{background:var(--edit)}.tl-dot.w1{background:var(--grey)}.tl-dot.w2{background:var(--amber)}.tl-dot.w3{background:var(--accent)}
  .tl-date{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:5px;text-align:center}

  .rec{display:grid;grid-template-columns:50px 1fr;border-bottom:1px solid var(--line)}
  .rec:last-child{border-bottom:none}
  .rec-lvl{display:flex;align-items:flex-start;justify-content:center;padding-top:15px;font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:#fff}
  .rec-lvl.w0{background:var(--edit)}.rec-lvl.w1{background:var(--grey)}.rec-lvl.w2{background:var(--amber)}.rec-lvl.w3{background:var(--accent)}
  .rec-body{padding:14px 18px}
  .rec-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
  .rec-reason{font-weight:600;font-size:14.5px}.rec-date{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .rec-note{margin-top:9px;font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:11px}

  .rev-block{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .rev-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--edit-soft);flex-wrap:wrap}
  .rev-head .st{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;font-weight:500}
  .rev-head .st .d{width:8px;height:8px;border-radius:50%}
  .st.open .d{background:var(--edit)}.st.closed .d{background:var(--green)}
  .st.open{color:var(--edit)}.st.closed{color:var(--green)}
  .rev-list{padding:4px 12px}
  .rev-item{padding:9px 0;border-bottom:1px dashed var(--line)}
  .rev-item:last-child{border-bottom:none}
  .rev-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;align-items:center}
  .rev-tag{padding:2px 7px;border-radius:999px;font-size:9px}
  .rev-tag.review{background:var(--amber-soft);color:var(--amber)}
  .rev-tag.feedback{background:var(--edit-soft);color:var(--edit)}
  .rev-tag.closed{background:var(--green-soft);color:var(--green)}
  .rev-text{font-size:13px}
  .rev-empty{font-size:12.5px;color:var(--muted);font-style:italic;padding:8px 0}
  .rev-add{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fafaf8;flex-wrap:wrap;align-items:flex-start}
  .rev-add select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);font-size:11px;text-transform:uppercase;background:#fff}
  .rev-add textarea{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px;resize:vertical;min-height:38px}
  .rev-add textarea:focus,.rev-add select:focus{outline:2px solid var(--edit);outline-offset:-1px}
  .mini{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;white-space:nowrap}
  .mini:hover{border-color:var(--ink)}
  .mini.go{background:var(--edit);color:#fff;border-color:var(--edit)}
  .mini.close-r{border-color:var(--green);color:var(--green)}.mini.close-r:hover{background:var(--green);color:#fff}
  .mini.reopen{border-color:var(--amber);color:var(--amber)}.mini.reopen:hover{background:var(--amber);color:#fff}

  .empty{text-align:center;padding:50px;color:var(--muted);font-family:var(--mono);font-size:13px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  @media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:29px}.rec{grid-template-columns:44px 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Parts Avatar · YYZ3 Mississauga · Operations</div>
      <h1>Associate Warning Register</h1>
      <div class="sub">All warnings at a glance · reviews saved on this device · confidential</div>
    </div>
    <div class="savestate"><span class="d"></span><span id="save">Saved</span></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button class="btn" onclick="exportXlsx()">Export Excel</button>
    <button class="btn" onclick="window.print()">Print / PDF</button>
    <button class="btn" onclick="expandAll(true)">Expand all</button>
    <button class="btn" onclick="expandAll(false)">Collapse all</button>
    <button class="btn" style="border-color:var(--accent);color:var(--accent)" onclick="resetReviews()">Reset all reviews</button>
  </div>

  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search name, reason, review, feedback…" autocomplete="off">
    </div>
    <div class="chips" id="chips">
      <div class="chip on" data-f="all">All</div>
      <div class="chip" data-f="1">1</div>
      <div class="chip" data-f="2">2</div>
      <div class="chip" data-f="3">3+</div>
      <div class="chip" data-f="revopen">Open reviews</div>
      <div class="chip" data-f="risk">Review due</div>
      <div class="chip" data-f="left">Left company</div>
    </div>
  </div>

  <div class="sortbar">Sort: <b data-s="count" class="on">Warnings ▾</b><b data-s="name">Name</b><b data-s="recent">Most recent</b><b data-s="review">Open reviews</b></div>

  <div id="list"></div>

  <div class="legend">
    <span><span class="b w1"></span>1st</span>
    <span><span class="b w2"></span>2nd</span>
    <span><span class="b w3"></span>3rd</span>
    <span><span class="flag" style="padding:2px 6px">3+ at risk</span></span>
    <span><span class="rev-tag review" style="padding:2px 6px">Review</span></span>
    <span><span class="rev-tag feedback" style="padding:2px 6px">Feedback</span></span>
    <span><span class="rev-tag closed" style="padding:2px 6px">Closed</span></span>
  </div>
</div>

<script>
/* ================= WARNING DATA =================
   Each warning has a stable id (used to attach reviews).
   ================================================= */
const DATA = [
  {name:"Rupinder Kaur",role:"Stower / Picker",left:true,warnings:[
    {id:"rup-1",level:1,date:"2026-05-15",reason:"Mobile-phone policy non-compliance (zero-tolerance) & workplace expectations",note:"Formal letter from Santhosh Joseph (Shift Supervisor – Evening). Emailed 16 May. Cites insufficient improvement after prior verbal guidance."},
    {id:"rup-2",level:2,date:"2026-07-07",reason:"Performance — productivity decline (Picking / Stowing / Packing)",note:"May avg 85% → June avg 68%, below benchmark. Email subject read 'First Written Warning' but this is her 2nd per sequence. Improved the following week."},
    {id:"rup-3",level:3,date:"2026-07-17",reason:"Unapproved absence 15 Jul 2026 — no leave applied",note:"Absent 15/Jul; flagged by Santhosh. Reply + justification requested by end of shift."},
  ]},
  {name:"Paramjeet Singh",role:"Warehouse Associate",warnings:[
    {id:"par-1",level:1,date:"2026-06-18",reason:"Mobile-phone policy non-compliance (zero-tolerance) & workplace expectations",note:"Formal letter from Santhosh Joseph. Emailed 20 Jun."},
    {id:"par-2",level:2,date:"2026-07-17",reason:"Unapproved absence 13 Jul 2026 — no leave applied in Bright",note:"Absent Mon 13/Jul; said he didn't get time to submit in Bright. Reply + justification requested."},
  ]},
  {name:"Froilan Oyco",role:"Picker",warnings:[
    {id:"fro-1",level:1,date:"2026-06-17",reason:"Productivity — Picking below benchmark for 7 consecutive weeks",note:"7-week avg 45% vs 100% target (best week 52%). Formal first written warning."},
    {id:"fro-2",level:2,date:"2026-09-24",reason:"Inconsistent performance — output volatile and below benchmark",note:"9-week run (20 Jul–20 Sep) averaging ~80%, ranging 58%–95%. Reframed from picking-decline to consistency, as recent picking recovered to 92–95% in several weeks while others dropped to 58–71%."},
  ]},
  {name:"Jeffery Morgan",role:"Returns Associate",warnings:[
    {id:"jef-1",level:1,date:"2026-06-15",reason:"Performance & operational concerns — returns processing",note:"Tiger/LKQ returns missed 7-day RGA window, VLOSS update delays, returns backlog, unfulfilled commitment to clear backlog, lack of proactive escalation. Apr–Jun 2026."},
  ]},
  {name:"Tanveer Kaur",role:"Warehouse Associate",warnings:[
    {id:"tan-1",level:1,date:"2026-05-15",reason:"Mobile-phone policy non-compliance (zero-tolerance) & workplace expectations",note:"Formal letter from Santhosh Joseph. Emailed 16 May. Cites insufficient improvement after prior verbal guidance."},
  ]},
  {name:"Roshon Charles",role:"Warehouse Associate",left:true,warnings:[
    {id:"ros-1",level:1,date:"2026-06-18",reason:"Failure to meet performance standards — recurring stowing errors",note:"Formal letter from Santhosh Joseph. Emailed 23 Jun. 4 corrective actions; 7-working-day monitoring period."},
  ]},
  {name:"Jaskaran Singh",role:"Packer",warnings:[
    {id:"jas-1",level:1,date:"2026-07-20",reason:"Mobile-phone policy non-compliance & packaging errors causing customer issues",note:"From Santhosh Joseph. Lists 5 required corrective actions."},
  ]},
  {name:"Daniela Silva",role:"Picker / Stower",warnings:[
    {id:"dan-1",level:0,date:"2026-09-24",reason:"First communication — performance & IT (working) hours shortfall",note:"Informal first communication (not a formal warning). 9-week run (20 Jul–20 Sep): performance avg ~81% and IT hours short every week (27–77%). Raised for awareness and improvement."},
  ]},
  {name:"Carlos Harrera",role:"Packer",left:true,warnings:[
    {id:"car-1",level:1,date:"2026-08-11",reason:"Verbal — packing productivity below benchmark",note:"First verbal warning. 6-week packing WPI avg ~75% (69–82%). Documented for record."},
  ]},
];
const REVIEW_DAYS=30;
const STORE_KEY="yyz3_warning_reviews_v1";

/* reviews shape: { [warningId]: { status:"open"|"closed", entries:[{kind, text, ts}] } } */
let REV={};
let activeFilter="all",query="",sortKey="count";

const lv=n=>n===0?'Note':(['','1st','2nd','3rd','4th','5th'][n]||n+'th');
const lvBadge=n=>n===0?'!':n;
const fmtDate=d=>{if(!d)return"";const x=new Date(d+'T00:00');return isNaN(x)?d:x.toLocaleDateString('en-CA',{day:'numeric',month:'short',year:'numeric'});};
const fmtTs=t=>new Date(t).toLocaleString('en-CA',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const daysSince=d=>{if(!d)return 1e9;const x=new Date(d+'T00:00');return isNaN(x)?1e9:(Date.now()-x)/864e5;};
const allW=()=>DATA.flatMap(p=>p.warnings);
function rev(id){if(!REV[id])REV[id]={status:"none",entries:[]};return REV[id];}
function isRisk(p){return p.warnings.length>=3;}
function reviewDue(p){const last=p.warnings.map(w=>w.date).filter(Boolean).sort().pop();return last&&daysSince(last)<=REVIEW_DAYS;}
function hasOpenReview(p){return p.warnings.some(w=>rev(w.id).status==="open");}

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)REV=JSON.parse(raw);}catch(e){REV={};}
  render();
}
function persist(){
  setSave("Saving…");
  try{localStorage.setItem(STORE_KEY,JSON.stringify(REV));setSave("Saved on this device");}
  catch(e){setSave("Save failed — use Export to keep a copy");}
}
function setSave(t){const el=document.getElementById('save');if(el)el.textContent=t;}

function stats(){
  const active=DATA.filter(p=>!p.left);
  const total=allW().length;
  const risk=active.filter(isRisk).length;
  const leftN=DATA.filter(p=>p.left).length;
  const openRev=allW().filter(w=>rev(w.id).status==="open").length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="n">${active.length}</div><div class="l">Active associates</div></div>
    <div class="stat"><div class="n">${total}</div><div class="l">Total warnings</div></div>
    <div class="stat acc"><div class="n">${risk}</div><div class="l">Active at 3+ warnings</div></div>
    <div class="stat acc"><div class="n">${openRev}</div><div class="l">Open reviews</div></div>
    <div class="stat"><div class="n">${leftN}</div><div class="l">Left company</div></div>`;
}
function match(p){
  const c=p.warnings.length;
  // "all" default hides those who left; a dedicated "left" filter shows only them
  if(activeFilter==="left"){if(!p.left)return false;}
  else if(activeFilter==="all"){if(p.left)return false;}
  else if(p.left)return false;  // any other filter is active-only
  if(activeFilter==="1"&&c!==1)return false;
  if(activeFilter==="2"&&c!==2)return false;
  if(activeFilter==="3"&&c<3)return false;
  if(activeFilter==="revopen"&&!hasOpenReview(p))return false;
  if(activeFilter==="risk"&&!(isRisk(p)||reviewDue(p)))return false;
  if(query){
    const revText=p.warnings.map(w=>rev(w.id).entries.map(e=>e.text).join(" ")).join(" ");
    const hay=(p.name+" "+p.role+" "+p.warnings.map(w=>w.reason+" "+w.note).join(" ")+" "+revText).toLowerCase();
    if(!hay.includes(query))return false;
  }
  return true;
}
function sortRows(rows){
  const r=[...rows];
  if(sortKey==="name")r.sort((a,b)=>a.name.localeCompare(b.name));
  if(sortKey==="count")r.sort((a,b)=>b.warnings.length-a.warnings.length);
  if(sortKey==="recent")r.sort((a,b)=>{const la=a.warnings.map(w=>w.date).filter(Boolean).sort().pop()||"";const lb=b.warnings.map(w=>w.date).filter(Boolean).sort().pop()||"";return lb.localeCompare(la);});
  if(sortKey==="review")r.sort((a,b)=>(hasOpenReview(b)?1:0)-(hasOpenReview(a)?1:0));
  return r;
}
function openStates(){return [...document.querySelectorAll('.assoc.open')].map(a=>a.dataset.nm);}
function render(){
  const wasOpen=new Set(openStates());
  const list=document.getElementById('list');
  const rows=sortRows(DATA.filter(match));
  if(!rows.length){list.innerHTML=`<div class="empty">No records match.</div>`;stats();return;}
  list.innerHTML=rows.map(p=>{
    const c=p.warnings.length;
    const latest=[...p.warnings].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).pop();
    const badges=p.warnings.map(w=>`<span class="b w${Math.min(w.level,3)}"></span>`).join("");
    let flag=isRisk(p)?`<span class="flag">3+ at risk</span>`:(reviewDue(p)?`<span class="flag due">Review due</span>`:"");
    if(hasOpenReview(p))flag=`<span class="flag rev">Review open</span>`+flag;
    if(p.left)flag=`<span class="flag gone">Left company</span>`+flag;
    const latestPill=latest?`<span class="latest l${Math.min(latest.level,3)}">Latest: ${lv(latest.level)}</span>`:"";
    const tl=p.warnings.map(w=>`<div class="tl-node"><div class="tl-line"></div><div class="tl-dot w${Math.min(w.level,3)}">${lvBadge(w.level)}</div><div class="tl-date">${w.date?fmtDate(w.date):'date TBC'}</div></div>`).join("");
    const recs=p.warnings.map(w=>{
      const rv=rev(w.id);
      const stCls=rv.status==="open"?"open":(rv.status==="closed"?"closed":"");
      const stLabel=rv.status==="open"?"Review open":(rv.status==="closed"?"Review closed":"No review");
      const entries=rv.entries.length? rv.entries.map(e=>`
        <div class="rev-item">
          <div class="rev-meta"><span class="rev-tag ${e.kind}">${e.kind}</span><span>${fmtTs(e.ts)}</span></div>
          <div class="rev-text">${esc(e.text)}</div>
        </div>`).join("") : `<div class="rev-empty">No review notes yet. Add the first below.</div>`;
      const closeBtn = rv.status==="closed"
        ? `<button class="mini reopen" onclick="reopen('${w.id}')">Reopen review</button>`
        : `<button class="mini close-r" onclick="closeReview('${w.id}')">Close review</button>`;
      return `<div class="rec">
        <div class="rec-lvl w${Math.min(w.level,3)}">${lvBadge(w.level)}</div>
        <div class="rec-body">
          <div class="rec-top"><div class="rec-reason">${w.reason||'Reason not recorded'}</div><div class="rec-date">${w.date?fmtDate(w.date):'date TBC'}</div></div>
          ${w.note?`<div class="rec-note">${esc(w.note)}</div>`:''}
          <div class="rev-block">
            <div class="rev-head">
              <span class="st ${stCls||'open'}" style="${rv.status==='none'?'color:var(--muted)':''}"><span class="d" style="${rv.status==='none'?'background:var(--muted)':''}"></span>${stLabel}${rv.entries.length?` · ${rv.entries.length} note${rv.entries.length>1?'s':''}`:''}</span>
              ${closeBtn}
            </div>
            <div class="rev-list">${entries}</div>
            <div class="rev-add">
              <select id="k-${w.id}"><option value="review">Review</option><option value="feedback">Feedback</option></select>
              <textarea id="t-${w.id}" placeholder="Add a review note or feedback…"></textarea>
              <button class="mini go" onclick="addEntry('${w.id}')">Add</button>
            </div>
          </div>
        </div></div>`;
    }).join("");
    const openCls=wasOpen.has(p.name)?'open':'';
    return `<div class="assoc ${isRisk(p)&&!p.left?'risk':''} ${p.left?'gone':''} ${openCls}" data-nm="${esc(p.name)}">
      <div class="assoc-head" onclick="if(!event.target.closest('.rev-block'))this.parentNode.classList.toggle('open')">
        <div class="count">${c}</div><div class="badges">${badges}</div>
        <div class="who"><div class="nm">${esc(p.name)}</div><div class="rl">${esc(p.role)}</div></div>
        ${flag}${latestPill}
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="detail"><div class="timeline">${tl}</div>${recs}</div>
    </div>`;
  }).join("");
  stats();
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ===== review actions ===== */
function addEntry(id){
  const ta=document.getElementById('t-'+id);const sel=document.getElementById('k-'+id);
  const text=ta.value.trim();if(!text)return;
  const r=rev(id);if(r.status==="none"||r.status==="closed")r.status="open";
  r.entries.push({kind:sel.value,text,ts:Date.now()});
  persist();render();
}
function closeReview(id){
  const r=rev(id);
  r.entries.push({kind:"closed",text:"Review closed.",ts:Date.now()});
  r.status="closed";persist();render();
}
function reopen(id){
  const r=rev(id);r.status="open";
  r.entries.push({kind:"review",text:"Review reopened.",ts:Date.now()});
  persist();render();
}
function expandAll(open){document.querySelectorAll('.assoc').forEach(a=>a.classList.toggle('open',open));}
function resetReviews(){
  if(!confirm('Clear ALL review and feedback notes on this device? The warning records stay. This cannot be undone.'))return;
  REV={};
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
  setSave('Reviews cleared');
  render();
}

/* ===== export ===== */
function flatRows(){
  const out=[];
  DATA.forEach(p=>p.warnings.forEach(w=>{
    const r=rev(w.id);
    out.push({
      Name:p.name,Role:p.role,Level:lv(w.level),
      "Date issued":w.date?fmtDate(w.date):"",Reason:w.reason,Note:w.note,
      "Review status":r.status==="none"?"—":r.status,
      "Review / Feedback":r.entries.map(e=>`[${e.kind} ${fmtTs(e.ts)}] ${e.text}`).join("  |  ")
    });
  }));
  return out;
}
function exportXlsx(){
  const ws=XLSX.utils.json_to_sheet(flatRows());
  ws['!cols']=[{wch:18},{wch:16},{wch:8},{wch:14},{wch:42},{wch:40},{wch:12},{wch:60}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Warnings");
  XLSX.writeFile(wb,"Warning_Register_YYZ3_"+new Date().toISOString().slice(0,10)+".xlsx");
}

/* ===== wire ===== */
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render();});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');activeFilter=c.dataset.f;render();}));
document.querySelectorAll('.sortbar b').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sortbar b').forEach(x=>x.classList.remove('on'));b.classList.add('on');sortKey=b.dataset.s;render();}));

load();
</script>
